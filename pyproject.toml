[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thinai-pygments"
version = "0.1.0"
description = "Pygments lexer for the Thinai domain-specific language"
requires-python = ">=3.10"
dependencies = ["Pygments>=2.17,<3"]

[dependency-groups]
docs = [
    "mkdocs-material>=9.6,<10",
    "mkdocs<2",
]

[project.entry-points."pygments.lexers"]
thinai = "thinai_pygments.lexer:ThinaiLexer"

[tool.setuptools.packages.find]
include = ["thinai_pygments*"]
