site_name: Thinai
site_description: A domain-specific modeling language for domain-driven design
site_url: https://thinai-lang.github.io/
repo_url: https://github.com/thinai-lang/thinai-lang.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/thinai-light.svg
  favicon: assets/thinai-light.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Language guides:
      - Language model: language-model.md
      - Tactical modeling: tactical-modeling.md
      - Events and behavior: events-and-behavior.md
  - Order Fulfillment example: https://github.com/thinai-lang/thinai/tree/main/examples/order-fulfillment

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.superfences
  - toc:
      permalink: true
